# PX4-focused robust SLAM profile.
#
# Goal: smoother, less speckled maps with sparse 360° ToF scans by
#  - using a finer grid resolution,
#  - reducing scan "smear" (less wall thickening / noise),
#  - enabling loop closing to correct drift over time.
slam_toolbox:
  ros__parameters:
    autostart: true
    mode: mapping
    use_sim_time: true

    odom_frame: robot/odom
    map_frame: robot/map
    base_frame: robot/base_footprint
    scan_topic: /scan_merged

    transform_timeout: 0.2
    transform_publish_period: 0.05
    tf_buffer_duration: 30.0
    map_update_interval: 1.0

    resolution: 0.05
    min_laser_range: 0.35
    # PX4 ToF ring clips at 4.0m at the sensor; we express ranges from base_link, so "no return"
    # beams are published at ~`4.0 + ring_radius_m ≈ 4.05m` (as a finite threshold that clears
    # free space in Karto). The `LaserScan.range_max` is intentionally padded slightly above that
    # so Karto doesn't ignore the no-return beams (it drops readings >= maxRange).
    #
    # Keep slam_toolbox's max range aligned with the no-return threshold (~4.05m) so those beams
    # are treated as free-space raytraces rather than obstacle endpoints (phantom ring).
    max_laser_range: 4.05
    minimum_time_interval: 0.10
    smear_deviation: 0.12

    # The PX4 ToF ring provides sparse / noisy returns. To keep maps stable, rely on
    # PX4's estimated odometry (EKF2 + external vision) for pose and reduce the
    # frequency of scan integration.
    use_scan_matching: false
    use_scan_barycenter: false
    do_loop_closing: false

    # Avoid integrating multiple nearly-identical scans while the vehicle is static
    # (PX4 offboard / takeoff can hover for a bit before exploring).
    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.06

    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.6
    link_scan_maximum_distance: 6.0

    # Occupancy generation: require more consistent hits to mark cells occupied.
    # This helps suppress speckle from sparse ToF scans.
    min_pass_through: 4
    occupancy_threshold: 0.25

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    debug_logging: false
    throttle_scans: 1
    enable_interactive_mode: false
