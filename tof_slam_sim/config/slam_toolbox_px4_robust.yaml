# PX4-focused robust SLAM profile.
#
# Goal: smoother, less speckled maps with sparse 360° ToF scans by
#  - using a finer grid resolution,
#  - reducing scan "smear" (less wall thickening / noise),
#  - enabling loop closing to correct drift over time.
slam_toolbox:
  ros__parameters:
    autostart: true
    mode: mapping
    use_sim_time: true

    odom_frame: robot/odom
    map_frame: robot/map
    base_frame: robot/base_footprint
    scan_topic: /scan_merged

    transform_timeout: 0.2
    transform_publish_period: 0.05
    tf_buffer_duration: 30.0
    map_update_interval: 1.0

    resolution: 0.05
    min_laser_range: 0.35
    # PX4 ToF ring clips around 4.0m.
    max_laser_range: 4.0
    minimum_time_interval: 0.15
    smear_deviation: 0.12

    # Avoid integrating multiple nearly-identical scans while the vehicle is static
    # (PX4 offboard / takeoff can hover for a bit before exploring).
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05

    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.6
    link_scan_maximum_distance: 6.0

    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.10
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_smear_deviation: 0.1
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_fine: 0.6

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    debug_logging: false
    throttle_scans: 1
    enable_interactive_mode: false
